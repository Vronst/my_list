[package]
name = "my_list"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
rust_decimal = "1.43.0"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "rust_decimal"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net"] }
uuid = { version = "1.29.3", features = ["serde"] }
#anyhow = "1.0"   # For clean error propagation
#dotenvy = "0.15" # For loading .env variables
